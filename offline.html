<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedang Offline — TaniRaya ERP</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1F3A8A 0%, #172B6B 55%, #101E52 100%);
    color: #1C1F33;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 22px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(28, 31, 51, .25);
  }
  .icon { font-size: 44px; line-height: 1; margin-bottom: 12px; }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0 0 22px; font-size: 14px; line-height: 1.5; color: #767B94; }
  button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #1F3A8A, #101E52);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Koneksi sedang tidak stabil</h1>
    <p>Halaman belum bisa dimuat karena koneksi lambat atau terputus. Data yang belum tersimpan tidak akan tercatat. Silakan coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
